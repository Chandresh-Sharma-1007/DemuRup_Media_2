<!--
==================================================================
DemuRup Media — HERO SECTION ONLY
==================================================================
This file is self-contained so it can be previewed on its own,
but everything inside <section class="dr-hero">...</section> is
the actual deliverable — drop that markup, the <style> block, and
the <script> block into the existing site. Nothing outside the
hero is meant to be used.

Sections below, clearly separated:
  1. HTML   → the hero markup
  2. CSS    → all styling + animation (inside <style>)
  3. JS     → entrance sequence + free-roam physics engine (inside <script>)

Floating cards use three nested layers so nothing fights over `transform`:
  .dr-card (entrance fade/scale, CSS keyframe)
    .dr-card__motion (continuous x/y/vx/vy physics position, JS/rAF)
      .dr-card__float (hover state, CSS)
        img
Cards have no fixed "home" — the JS engine gives each one its own
position + velocity and moves it every frame, DVD-logo style,
bouncing off the hero edges, a safe zone around the headline, and
each other, forever, with no restart/loop/teleport.

No frameworks, no libraries — vanilla HTML/CSS/JS only.
The single Google Fonts <link> below is a font resource, not a
library; if the build must be fully offline, delete that <link>
and the two @font-face fallbacks in CSS will use system fonts.
==================================================================
-->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DemuRup Media — Hero</title>

<link rel="preload" href="fonts/TheSeasons-Regular.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/TheSeasons-Bold.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/BeautifulDelight-Regular.woff2" as="font" type="font/woff2" crossorigin>

<!-- ============================== CSS ============================== -->
<style>

  /* -------------------------------------------------------------
     0. TOKENS — brand palette + type scale, all locked to the brief
  --------------------------------------------------------------*/
  :root{
    --dr-bg:            #000000;
    --dr-bg-alt:        #060606;
    --dr-accent:        #00cc33;
    --dr-accent-dim:    rgba(0,204,51,0.35);
    --dr-card:          #080808;
    --dr-card-alt:      #090909;
    --dr-border:        #1e1e1e;
    --dr-border-soft:   #111111;
    --dr-text:          #ffffff;
    --dr-text-mute:     #a0a0a0;
    --dr-text-faint:    rgba(255,255,255,0.45);

    --dr-font-display:  "The Seasons", serif;
    --dr-font-body:     "Beautiful Delight", serif;

    --dr-ease:          cubic-bezier(0.16, 1, 0.3, 1); /* cinematic decel */
  }

  /* -------------------------------------------------------------
     1. HERO SHELL + BACKGROUND
     Pitch black base, a hair of graphite variance, and a very
     faint film-grain noise layer (single inline SVG, no image
     request) to keep the black from feeling flat/plastic.
  --------------------------------------------------------------*/
  .dr-hero{
    position: relative;
    width: 100%;
    min-height: 100vh;
    background:
      repeating-linear-gradient(45deg, rgba(255,255,255,0.02) 0px, rgba(255,255,255,0.02) 1px, transparent 1px, transparent 90px),
      radial-gradient(38% 46% at 14% 18%, rgba(0,204,51,0.10) 0%, rgba(0,204,51,0) 70%),
      radial-gradient(46% 50% at 88% 82%, rgba(0,204,51,0.06) 0%, rgba(0,204,51,0) 70%),
      linear-gradient(155deg, rgba(255,255,255,0.035) 0%, rgba(255,255,255,0) 32%),
      radial-gradient(130% 95% at 50% 0%, var(--dr-bg-alt) 0%, var(--dr-bg) 62%);
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    isolation: isolate;
  }

  /* oversized faint concentric-circle patterns, sitting behind the text —
     built from repeating-radial-gradient so no image request is needed */
  .dr-hero__rings{
    position: absolute;
    inset: 0;
    z-index: 1;
    pointer-events: none;
  }
  .dr-hero__rings::before,
  .dr-hero__rings::after{
    content: "";
    position: absolute;
    width: 90vmax;
    height: 90vmax;
    border-radius: 50%;
    background: repeating-radial-gradient(
      circle at center,
      transparent 0px, transparent 46px,
      rgba(255,255,255,0.05) 47px, rgba(255,255,255,0.05) 48px,
      transparent 49px, transparent 95px
    );
  }
  .dr-hero__rings::before{ top: -30vmax; left: -18vmax; opacity: 0.7; }
  .dr-hero__rings::after{  bottom: -34vmax; right: -20vmax; opacity: 0.55; }

  .dr-hero::before{
    /* subtle grain / noise texture, keeps the black from feeling flat */
    content: "";
    position: absolute;
    inset: 0;
    z-index: 1;
    pointer-events: none;
    opacity: 0.14;
    mix-blend-mode: overlay;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
    background-size: 220px 220px;
  }

  .dr-hero::after{
    /* soft vignette — enough to pull focus to center without crushing the edges to black */
    content: "";
    position: absolute;
    inset: 0;
    z-index: 1;
    pointer-events: none;
    background: radial-gradient(92% 75% at 50% 45%, transparent 45%, rgba(0,0,0,0.4) 100%);
  }

  /* -------------------------------------------------------------
     2. HEADLINE
  --------------------------------------------------------------*/
  .dr-hero__headline{
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    z-index: 3;
    width: 100%;
    max-width: 62rem;
    margin: 0;
    padding: 0 1.5rem;
    text-align: center;
    font-family: var(--dr-font-display);
    font-weight: 900;
    text-transform: uppercase;
    color: var(--dr-text);
    font-size: clamp(1.5rem, 3.2vw, 3.1rem);
    line-height: 1.12;
    letter-spacing: -0.005em;
  }

  .dr-hero__line{
    display: block;
    overflow: hidden; /* masks the word-reveal */
    padding-bottom: 0.08em; /* keep descenders from clipping */
  }

  /* every word is its own inline-block so it can animate independently */
  .dr-word{
    display: inline-block;
    transform: translateY(115%);
    opacity: 0;
    filter: blur(9px);
    will-change: transform, opacity, filter;
  }

  .dr-word + .dr-word{ margin-left: 0.28em; }

  .dr-word--accent{ color: var(--dr-accent); }

  /* signature element: "BOX" gets a literal viewfinder/reel-frame
     drawn around it — a nod to the reel covers, and a visual pun
     on "redesigning the box" once it locks into place on load. */
  .dr-word--framed{
    position: relative;
    color: var(--dr-text);
    padding: 0 0.14em;
  }
  .dr-word--framed::before,
  .dr-word--framed::after{
    content: "";
    position: absolute;
    top: -0.14em;
    bottom: -0.14em;
    width: 0.32em;
    border: 2px solid var(--dr-accent);
    opacity: 0;
    transform: scaleY(0.4);
    transition: none;
  }
  .dr-word--framed::before{ left: -0.06em; border-right: none; }
  .dr-word--framed::after{ right: -0.06em; border-left: none; }

  .dr-hero.is-revealed .dr-word{
    animation: dr-word-in 1.3s var(--dr-ease) forwards;
  }
  .dr-hero.is-revealed .dr-word--framed::before,
  .dr-hero.is-revealed .dr-word--framed::after{
    animation: dr-frame-in 0.7s var(--dr-ease) forwards;
    animation-delay: 1.05s;
  }

  /* per-word stagger */
  .dr-hero.is-revealed .dr-line-1 .dr-word:nth-child(1){ animation-delay: 0.05s; }
  .dr-hero.is-revealed .dr-line-1 .dr-word:nth-child(2){ animation-delay: 0.12s; }
  .dr-hero.is-revealed .dr-line-1 .dr-word:nth-child(3){ animation-delay: 0.19s; }
  .dr-hero.is-revealed .dr-line-1 .dr-word:nth-child(4){ animation-delay: 0.26s; }
  .dr-hero.is-revealed .dr-line-2 .dr-word:nth-child(1){ animation-delay: 0.33s; }
  .dr-hero.is-revealed .dr-line-2 .dr-word:nth-child(2){ animation-delay: 0.40s; }
  .dr-hero.is-revealed .dr-line-2 .dr-word:nth-child(3){ animation-delay: 0.47s; }
  .dr-hero.is-revealed .dr-line-3 .dr-word:nth-child(1){ animation-delay: 0.55s; }
  .dr-hero.is-revealed .dr-line-3 .dr-word:nth-child(2){ animation-delay: 0.62s; }
  .dr-hero.is-revealed .dr-line-3 .dr-word:nth-child(3){ animation-delay: 0.69s; }

  @keyframes dr-word-in{
    to{ transform: translateY(0); opacity: 1; filter: blur(0); }
  }
  @keyframes dr-frame-in{
    to{ opacity: 1; transform: scaleY(1); }
  }

  /* -------------------------------------------------------------
     3. FLOATING REEL CARDS
     Three nested layers so nothing fights over `transform`:
       .dr-card         entrance fade/scale only (CSS keyframe)
         .dr-card__motion   continuous DVD-style physics position +
                             rotation + breathing scale (JS/rAF, every frame)
           .dr-card__float  hover state only (CSS)
             img
     Cards have NO fixed home position — .dr-card is anchored at
     (0,0) and the physics engine below places it anywhere in the
     hero by writing translate3d(x,y,0) to .dr-card__motion.
  --------------------------------------------------------------*/
  .dr-card{
    position: absolute;
    top: 0;
    left: 0;
    z-index: 2;
    display: block;
    text-decoration: none;
    opacity: 0;
    will-change: transform;
  }

  .dr-hero.is-revealed .dr-card{
    animation: dr-card-in 1s var(--dr-ease) forwards;
  }

  /* size + entrance stagger only — no position, that's fully JS-driven */
  .dr-card--1{ width: clamp(80px,7.6vw,120px);  animation-delay: 0.15s; }
  .dr-card--2{ width: clamp(74px,7vw,108px);    animation-delay: 0.30s; }
  .dr-card--3{ width: clamp(96px,9.4vw,150px);  animation-delay: 0.45s; }
  .dr-card--4{ width: clamp(84px,8vw,126px);    animation-delay: 0.6s; }
  .dr-card--5{ width: clamp(70px,6.6vw,100px);  animation-delay: 0.75s; }

  .dr-card__float{ aspect-ratio: 9 / 16; }

  @keyframes dr-card-in{
    from{ opacity: 0; transform: translate3d(0,18px,0) scale(0.94); }
    to{   opacity: 1; transform: translate3d(0,0,0) scale(1); }
  }

  /* physics layer — transform written here every frame by the JS
     DVD-style position/velocity engine below */
  .dr-card__motion{
    display: block;
    will-change: transform;
  }

  .dr-card__float{
    display: block;
    border-radius: 14px;
    border: 1px solid var(--dr-border);
    background: linear-gradient(160deg, var(--dr-card) 0%, var(--dr-card-alt) 100%);
    box-shadow: 0 18px 40px -18px rgba(0,0,0,0.85);
    overflow: hidden;
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    transition: box-shadow 0.35s var(--dr-ease), border-color 0.35s var(--dr-ease), filter 0.35s var(--dr-ease);
    will-change: transform;
  }

  .dr-card__float img{
    display: block;
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  /* soft brand-green glow ring, hidden until hover */
  .dr-card__float::after{
    content: "";
    position: absolute;
    inset: 0;
    border-radius: inherit;
    box-shadow: 0 0 0 0 var(--dr-accent-dim);
    opacity: 0;
    transition: opacity 0.35s var(--dr-ease), box-shadow 0.35s var(--dr-ease);
    pointer-events: none;
  }

  .dr-card:hover{ cursor: pointer; }
  .dr-card:hover .dr-card__float{
    border-color: var(--dr-accent);
    box-shadow: 0 24px 50px -16px rgba(0,0,0,0.9);
    filter: brightness(1.08);
    transform: scale(1.045) rotate(1deg);
  }
  .dr-card:hover .dr-card__float::after{
    opacity: 1;
    box-shadow: 0 0 26px 2px var(--dr-accent-dim);
  }
  .dr-card:focus-visible{ outline: 2px solid var(--dr-accent); outline-offset: 4px; border-radius: 14px; }

  /* -------------------------------------------------------------
     4. RESPONSIVE — smaller cards on small screens; physics engine
     re-measures on resize so movement adapts automatically
  --------------------------------------------------------------*/
  @media (max-width: 760px){
    .dr-hero__headline{ max-width: 26rem; }
    .dr-card--1{ width: clamp(58px,17vw,82px); }
    .dr-card--2{ width: clamp(54px,15vw,76px); }
    .dr-card--3{ width: clamp(58px,17vw,82px); }
    .dr-card--4{ width: clamp(56px,16vw,80px); }
    .dr-card--5{ display: none; } /* keep only the strongest layout on mobile */
  }

  @media (max-width: 420px){
    .dr-hero__headline{ font-size: clamp(1.7rem, 8.5vw, 2.3rem); }
    .dr-card--1, .dr-card--2, .dr-card--3, .dr-card--4{
      width: 64px;
      filter: brightness(0.9);
    }
  }

  /* -------------------------------------------------------------
     5. ACCESSIBILITY — respect reduced motion
  --------------------------------------------------------------*/
  @media (prefers-reduced-motion: reduce){
    .dr-word{ transform: none; opacity: 1; filter: none; animation: none !important; }
    .dr-word--framed::before, .dr-word--framed::after{ opacity: 1; transform: scaleY(1); animation: none !important; }
    .dr-hero__sub{ opacity: 1; transform: none; animation: none !important; }
    .dr-card{ opacity: 1; animation: none !important; }
    /* .dr-card__motion is intentionally NOT reset here — JS still sets a
       single static spread-out position for reduced-motion users so cards
       don't collapse to the top-left corner; it just skips the continuous
       physics loop and mouse parallax. See script below. */
  }
</style>
</head>
<body>

<!-- ============================== HTML ============================== -->

<script>
(function(){
  "use strict";

  var hero = document.querySelector(".dr-hero");
  var headline = document.querySelector(".dr-hero__headline");
  if(!hero || !headline) return;

  var reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var isTouch = window.matchMedia("(pointer: coarse)").matches;

  /* ---- 1. Entrance sequence -----------------------------------
     Adding this class after first paint triggers the CSS
     keyframe stagger defined above (word reveal + card fade-in). */
  requestAnimationFrame(function(){
    requestAnimationFrame(function(){
      hero.classList.add("is-revealed");
    });
  });

  /* ---- 2. Free-roam DVD-logo-style physics engine ---------------
     Each visible card is a rigid body with position (x,y) and
     velocity (vx,vy) in px/sec. Every frame we integrate position,
     then resolve three kinds of collision: the hero's own edges,
     an invisible safe zone around the headline, and the other
     cards. Nothing ever snaps back to a "home" — once started, a
     card's path is continuous and permanent (only redirected by
     a bounce), so it never restarts, loops, or teleports. */

  var motionEls = Array.prototype.slice.call(hero.querySelectorAll(".dr-card__motion"));
  var cardEls   = Array.prototype.slice.call(hero.querySelectorAll(".dr-card"));

  // filter out any card hidden by CSS (e.g. the 5th card on mobile)
  var active = [];
  cardEls.forEach(function(cardEl, i){
    if(getComputedStyle(cardEl).display !== "none"){
      active.push({ card: cardEl, motion: motionEls[i] });
    }
  });
  if(!active.length) return;

  // px/sec — every card gets its own speed, per spec
  var speeds = [18, 24, 20, 28, 22];
  // initial travel direction, degrees — spread out so nothing moves in sync
  var angles = [35, 205, 120, 300, 165];
  // rotation / breathing-scale motion profile, purely cosmetic (not
  // tied to travel direction), tiny amplitude, own frequency+phase
  var spinProfiles = [
    { rot: 2.6, fr: 0.16, pr: 0.4, sc: 0.018, fs: 0.11, ps: 1.0 },
    { rot: 2.2, fr: 0.13, pr: 1.8, sc: 0.015, fs: 0.14, ps: 0.2 },
    { rot: 3.0, fr: 0.11, pr: 2.6, sc: 0.02,  fs: 0.09, ps: 2.1 },
    { rot: 2.4, fr: 0.18, pr: 0.9, sc: 0.016, fs: 0.15, ps: 1.4 },
    { rot: 2.8, fr: 0.14, pr: 3.1, sc: 0.019, fs: 0.1,  ps: 0.7 }
  ];
  // parallax "depth" — how much each card nudges toward the cursor,
  // kept small: the free-roam travel is the primary motion, per spec
  var depths = [0.35, 0.22, 0.4, 0.28, 0.2];

  var W = 0, H = 0;                 // hero bounds, px
  var safe = {l:0,t:0,r:0,b:0};     // headline safe-zone rect, px, hero-relative
  var SAFE_PAD = 34;                // extra breathing room around the headline

  var bodies = []; // { el, w, h, x, y, vx, vy, spin }

  function measure(){
    var heroRect = hero.getBoundingClientRect();
    W = heroRect.width;
    H = heroRect.height;

    var hRect = headline.getBoundingClientRect();
    safe.l = (hRect.left - heroRect.left) - SAFE_PAD;
    safe.t = (hRect.top  - heroRect.top)  - SAFE_PAD;
    safe.r = (hRect.right  - heroRect.left) + SAFE_PAD;
    safe.b = (hRect.bottom - heroRect.top)  + SAFE_PAD;

    bodies.forEach(function(b){
      var r = b.el.getBoundingClientRect();
      b.w = r.width;
      b.h = r.height;
      // clamp existing position into the new bounds so a resize never
      // teleports a card off-screen or outside the hero
      b.x = Math.min(Math.max(b.x, 0), Math.max(0, W - b.w));
      b.y = Math.min(Math.max(b.y, 0), Math.max(0, H - b.h));
    });
  }

  function rectsOverlap(ax1,ay1,ax2,ay2, bx1,by1,bx2,by2){
    return ax1 < bx2 && ax2 > bx1 && ay1 < by2 && ay2 > by1;
  }

  // spread starting spots (fractions of hero size) roughly matching the
  // earlier corner layout, just as a pleasant, non-overlapping launch
  // point — from here on, motion is 100% free-roam physics
  var startFrac = [
    { fx: 0.09, fy: 0.20 },
    { fx: 0.46, fy: 0.10 },
    { fx: 0.82, fy: 0.24 },
    { fx: 0.14, fy: 0.76 },
    { fx: 0.80, fy: 0.68 }
  ];

  active.forEach(function(pair, i){
    var r = pair.card.getBoundingClientRect();
    var heroRect = hero.getBoundingClientRect();
    var w = r.width, h = r.height;
    var sf = startFrac[i] || startFrac[0];
    var speed = speeds[i] || 20;
    var ang = (angles[i] || 40) * Math.PI / 180;

    bodies.push({
      el: pair.card,
      motion: pair.motion,
      w: w, h: h,
      x: sf.fx * (hero.clientWidth || heroRect.width) - w / 2,
      y: sf.fy * (hero.clientHeight || heroRect.height) - h / 2,
      vx: Math.cos(ang) * speed,
      vy: Math.sin(ang) * speed,
      spin: spinProfiles[i] || spinProfiles[0],
      depth: depths[i] || 0.3
    });
  });

  measure();
  window.addEventListener("resize", measure);

  /* ---- Mouse parallax (subtle, secondary) ---- */
  var mouseTX = 0, mouseTY = 0;
  var mouseCX = 0, mouseCY = 0;
  if(!isTouch && !reduceMotion){
    hero.addEventListener("mousemove", function(e){
      var rect = hero.getBoundingClientRect();
      mouseTX = ((e.clientX - rect.left) / rect.width  - 0.5) * 2;
      mouseTY = ((e.clientY - rect.top)  / rect.height - 0.5) * 2;
    }, { passive: true });
    hero.addEventListener("mouseleave", function(){
      mouseTX = 0; mouseTY = 0;
    });
  }

  function render(t){
    for(var i = 0; i < bodies.length; i++){
      var b = bodies[i];
      var s = b.spin;
      var rot = Math.sin(t * s.fr + s.pr) * s.rot;
      var scale = 1 + Math.sin(t * s.fs + s.ps) * s.sc;
      var parX = mouseCX * 12 * b.depth;
      var parY = mouseCY * 12 * b.depth;

      b.motion.style.transform =
        "translate3d(" + (b.x + parX).toFixed(2) + "px," + (b.y + parY).toFixed(2) + "px,0) " +
        "rotate(" + rot.toFixed(2) + "deg) scale(" + scale.toFixed(3) + ")";
    }
  }

  if(reduceMotion){
    // static, non-overlapping placement — no travel, no parallax loop
    render(0);
    return;
  }

  var lastTime = null;

  function tick(now){
    if(lastTime === null) lastTime = now;
    var dt = (now - lastTime) / 1000;
    lastTime = now;
    // guard against huge jumps if the tab was backgrounded
    if(dt > 0.05) dt = 0.05;

    mouseCX += (mouseTX - mouseCX) * 0.08;
    mouseCY += (mouseTY - mouseCY) * 0.08;

    var i, b;

    // 1) integrate position
    for(i = 0; i < bodies.length; i++){
      b = bodies[i];
      b.x += b.vx * dt;
      b.y += b.vy * dt;
    }

    // 2) bounce off the hero's own edges
    for(i = 0; i < bodies.length; i++){
      b = bodies[i];
      if(b.x < 0){ b.x = 0; b.vx = Math.abs(b.vx); }
      if(b.x + b.w > W){ b.x = W - b.w; b.vx = -Math.abs(b.vx); }
      if(b.y < 0){ b.y = 0; b.vy = Math.abs(b.vy); }
      if(b.y + b.h > H){ b.y = H - b.h; b.vy = -Math.abs(b.vy); }
    }

    // 3) bounce off the headline safe zone (static rectangle)
    for(i = 0; i < bodies.length; i++){
      b = bodies[i];
      var bx1 = b.x, by1 = b.y, bx2 = b.x + b.w, by2 = b.y + b.h;
      if(rectsOverlap(bx1,by1,bx2,by2, safe.l,safe.t,safe.r,safe.b)){
        // penetration depth from each side — push out the shortest way
        var penLeft   = bx2 - safe.l;
        var penRight  = safe.r - bx1;
        var penTop    = by2 - safe.t;
        var penBottom = safe.b - by1;
        var minPen = Math.min(penLeft, penRight, penTop, penBottom);

        if(minPen === penLeft){        b.x = safe.l - b.w; b.vx = -Math.abs(b.vx); }
        else if(minPen === penRight){  b.x = safe.r;        b.vx =  Math.abs(b.vx); }
        else if(minPen === penTop){    b.y = safe.t - b.h;  b.vy = -Math.abs(b.vy); }
        else{                          b.y = safe.b;        b.vy =  Math.abs(b.vy); }
      }
    }

    // 4) bounce off each other (simple AABB separation + reflection)
    for(i = 0; i < bodies.length; i++){
      for(var j = i + 1; j < bodies.length; j++){
        var a = bodies[i], c = bodies[j];
        var pad = 6; // keep a small visible gap between cards
        var ax1 = a.x - pad/2, ay1 = a.y - pad/2, ax2 = a.x + a.w + pad/2, ay2 = a.y + a.h + pad/2;
        var cx1 = c.x - pad/2, cy1 = c.y - pad/2, cx2 = c.x + c.w + pad/2, cy2 = c.y + c.h + pad/2;

        if(rectsOverlap(ax1,ay1,ax2,ay2, cx1,cy1,cx2,cy2)){
          var overlapX = Math.min(ax2,cx2) - Math.max(ax1,cx1);
          var overlapY = Math.min(ay2,cy2) - Math.max(ay1,cy1);

          if(overlapX < overlapY){
            var pushX = overlapX / 2;
            if(a.x < c.x){ a.x -= pushX; c.x += pushX; }
            else{ a.x += pushX; c.x -= pushX; }
            var avx = a.vx, cvx = c.vx;
            a.vx = cvx; c.vx = avx; // exchange x-momentum, DVD-corner-style
          } else {
            var pushY = overlapY / 2;
            if(a.y < c.y){ a.y -= pushY; c.y += pushY; }
            else{ a.y += pushY; c.y -= pushY; }
            var avy = a.vy, cvy = c.vy;
            a.vy = cvy; c.vy = avy;
          }

          // re-clamp to hero bounds in case separation pushed a card out
          a.x = Math.min(Math.max(a.x, 0), Math.max(0, W - a.w));
          a.y = Math.min(Math.max(a.y, 0), Math.max(0, H - a.h));
          c.x = Math.min(Math.max(c.x, 0), Math.max(0, W - c.w));
          c.y = Math.min(Math.max(c.y, 0), Math.max(0, H - c.h));
        }
      }
    }

    render(now / 1000);
    requestAnimationFrame(tick);
  }

  requestAnimationFrame(tick);

})();
</script>

</body>
</html>
